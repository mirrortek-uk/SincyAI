[package]
name = "sincy-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Device agent core: verifies signed app adapters and executes them on-device. Host-testable; the Android agent (android/rust-core) wraps this crate over JNI so device behavior cannot diverge from server policy."

[dependencies]
sincy-adapter = { path = "../sincy-adapter" }
sincy-protocol = { path = "../sincy-protocol" }
sincy-common = { path = "../sincy-common" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = "0.3"
reqwest = { workspace = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lib]
name = "sincy_agent"
path = "src/lib.rs"

[[bin]]
name = "sincy-agent-sim"
path = "src/bin/sincy-agent-sim.rs"

[dev-dependencies]
base64 = { workspace = true }
hex = "0.4"
rand = "0.8"
ed25519-dalek = { workspace = true }
