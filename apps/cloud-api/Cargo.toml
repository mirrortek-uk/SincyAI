[package]
name = "cloud-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sincy Cloud REST API + Agent WSS gateway entrypoint (TDD 12.1, /api/v1)"

[dependencies]
sincy-common = { path = "../../crates/sincy-common" }
sincy-config = { path = "../../crates/sincy-config" }
sincy-protocol = { path = "../../crates/sincy-protocol" }
sincy-database = { path = "../../crates/sincy-database" }
sincy-security = { path = "../../crates/sincy-security" }
sincy-routing = { path = "../../crates/sincy-routing" }
sincy-platform = { path = "../../crates/sincy-platform" }
sincy-content = { path = "../../crates/sincy-content" }
sincy-execution = { path = "../../crates/sincy-execution" }
sincy-device = { path = "../../crates/sincy-device" }
futures-util = "0.3"
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
sha2 = { workspace = true }
futures-util = "0.3"
