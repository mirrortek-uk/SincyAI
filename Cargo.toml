[workspace]
resolver = "2"
members = [
    "crates/sincy-common",
    "crates/sincy-config",
    "crates/sincy-protocol",
    "crates/sincy-database",
    "crates/sincy-security",
    "crates/sincy-routing",
    "crates/sincy-platform",
    "crates/sincy-content",
    "crates/sincy-execution",
    "crates/sincy-device",
    "crates/sincy-adapter",
    "crates/sincy-agent",
    "crates/sincy-intel",
    "crates/sincy-employee",
    "crates/sincy-transfer",
    "crates/sincy-ai",
    "apps/cloud-api",
    "apps/cloud-scheduler",
    "apps/agent-worker",
    "apps/router-worker",
    "android/rust-core",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sincy/sincy"

[workspace.dependencies]
# async runtime / http
tokio = { version = "1.48", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# data layer
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

# time / ids
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

# security
argon2 = "0.5"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = { version = "0.9", features = ["os_rng"] }
sha2 = "0.10"
base64 = "0.22"

# protocol
prost = "0.14"
prost-types = "0.14"

# misc
regex = "1"
once_cell = "1"

[profile.release]
debug = true
