[package]
name = "sincy-agent-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sincy Android agent Rust core (JNI): thin wrapper over crates/sincy-agent so on-device execution is byte-identical to the host-verified agent core"

[lib]
# rlib lets host tests/examples exercise the exact same code; cdylib is what
# the Android app loads via System.loadLibrary("sincy_agent_core").
crate-type = ["cdylib", "rlib"]

[dependencies]
ed25519-dalek = { workspace = true }
sincy-agent = { path = "../../crates/sincy-agent" }
sincy-adapter = { path = "../../crates/sincy-adapter" }
sincy-protocol = { path = "../../crates/sincy-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.21", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21" }
