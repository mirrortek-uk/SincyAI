# X (Twitter) 回帖设备自动化 App Adapter (v19)。
# 与 x.publish_post 同一策略: 不走付费 API, 走设备自动化; Sincy 签名发布,
# 设备只执行签名有效且 App 版本在范围内的版本。
# 回复内容来自内容包 (value: "package.text" —— 设备端验签后由
# task_context.package_text 替换, 不参与签名)。
# v19 真机核验 (X 12.45.1-prod.01, 中文 locale, 1080x2184):
#   home 顶栏 id: home_navigation_bar_title; 首帖操作栏"回复"按钮坐标 ~(223,640)
#   全屏编辑页 id: ComposerRoot; 输入框占位 "有什么新鲜事？"; 右上发布按钮坐标 ~(964,176)
adapter: x.reply_comment
version: 40
app:
  package: com.twitter.android
  version_range: ">=10.0"
screens:
  main_nav:
    # 任何带底部导航的主页面 (X 打开时可能停在任意 tab)
    anchors:
      - { text_any: ["主页", "Home"] }
      - { text_any: ["通知标签", "Notifications", "私信", "Messages"] }
  home:
    anchors:
      # home 顶栏标题 (真机: id home_navigation_bar_title)
      - { id: "home_navigation_bar_title" }
  tweet_detail:
    anchors:
      # 详情页根节点 id (真机: PostDetail); 单锚点, 滚动后仍可识别
      - { id: "PostDetail" }
  composer:
    # X 12.45 全屏编辑页 (真机: id ComposerRoot)
    anchors:
      - { id: "ComposerRoot" }
  reply_sent:
    anchors:
      - { text_any: ["Your reply was sent", "Reply sent", "回复已发送", "已发送", "你的回复已发布", "已发布"] }
  challenge:
    anchors:
      - { text_any: ["Verify you are human", "unusual activity", "安全验证", "人机验证", "保存帖子", "Save post", "草稿"] }   # always -> WAITING_USER (含"保存草稿"对话框, 绝不自动丢弃)
  update_dialog:
    anchors:
      - { text_any: ["Update now", "立即更新"] }
flow:
  - { expect: main_nav, action: tap, target: { text_any: ["主页", "Home"] } }
  - { expect: home, action: wait, value: "4000" }
  # 点首帖时间戳区进入详情页 (真机: 首帖头部 y≈440)
  - { expect: home, action: tap_at, target: { id: "timeline_post" }, value: "{\"x\":820,\"y\":440}" }
  - { expect: tweet_detail, action: wait, value: "3000" }
  # 详情页底部内联回复框 (节点语义 click, 不受系统导航手势区影响)
  - { expect: tweet_detail, action: tap, target: { text: "打开完整编辑器" } }
  - { expect: composer, action: wait, value: "2500" }
  - { expect: composer, action: set_text, target: { text_any: ["有什么新鲜事？", "What's happening?", "Post your reply", "发帖回复"] }, value: "package.text" }
  - { expect: composer, action: wait, value: "800" }
  - { expect: composer, action: tap_at, target: { text_any: ["回复", "Reply", "发布", "Post"] }, value: "{\"x\":964,\"y\":176}", side_effect: true }
  - { expect: reply_sent, action: wait, value: "3000", verify: true }
known_interrupts:
  - { screen: update_dialog, action: tap, target: { text_any: ["Not now", "以后再说", "暂不", "取消"] } }
